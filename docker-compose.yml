services:
  postgres:
    image: postgres:16-alpine
    container_name: docmind-postgres
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
    volumes:
      - docmind_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: docmind-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/docmind
      DB_USER: docmind
      DB_PASSWORD: docmind
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET: ${JWT_SECRET:-changez-moi-cette-cle-doit-faire-32-caracteres-minimum}
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    container_name: docmind-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  docmind_data:

spring.application.name=docmind

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docmind}
spring.datasource.username=${DB_USER:docmind}
spring.datasource.password=${DB_PASSWORD:docmind}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

docmind.jwt.secret=${JWT_SECRET:changez-moi-cette-cle-doit-faire-32-caracteres-minimum}
docmind.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
docmind.cors.origins=${CORS_ORIGINS:http://localhost:4200}
docmind.demo.enabled=${DEMO_ENABLED:true}

docmind.groq.api-key=${GROQ_API_KEY:}
docmind.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
docmind.groq.url=${GROQ_URL:https://api.groq.com/openai/v1}

docmind.ocr.datapath=${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
docmind.ocr.language=${OCR_LANGUAGE:fra+eng}
